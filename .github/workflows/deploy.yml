name: Build and Deploy

on:
  push:
    branches: [main]
    paths: ['gitOps/app/demo/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate image tag
      id: tag
      run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./gitOps/app/demo
        push: true
        tags: judethegemini/demoapp:${{ steps.tag.outputs.IMAGE_TAG }}

    - name: Update deployment
      run: |
        sed -i "s|judethegemini/demoapp:.*|judethegemini/demoapp:${{ steps.tag.outputs.IMAGE_TAG }}|" gitOps/app/demo/deployment.yaml
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add gitOps/app/demo/deployment.yaml
        git commit -m "Update image to ${{ steps.tag.outputs.IMAGE_TAG }}"
        git push