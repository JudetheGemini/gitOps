apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rails-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JudetheGemini/DevOps-Coding-Assessment.git
    targetRevision: HEAD
    path: task-2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
