apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-and-push-pipelinerun
spec:
  pipelineRef:
    name: build-and-push-pipeline
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: shared-workspace-pvc
  params:
    - name: git-url
      value: https://github.com/JudetheGemini/railsapp.git
    - name: git-revision
      value: main
    - name: image-url
      value: docker.io/judethegemini/railsapp:latest
